<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Dark Web Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --accent: #58a6ff; --red: #f85149; --green: #3fb950; --yellow: #d29922;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 40px; width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 1.3rem; font-weight: 700; }
    .flash { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 20px; }
    .flash.error { background: rgba(248,81,73,0.15); border: 1px solid rgba(248,81,73,0.4); color: #f85149; }
    .flash.info { background: rgba(88,166,255,0.12); border: 1px solid rgba(88,166,255,0.3); color: #58a6ff; }
    .flash.success { background: rgba(63,185,80,0.15); border: 1px solid rgba(63,185,80,0.4); color: #3fb950; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="email"], input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); padding: 10px 14px; font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; margin-bottom: 10px; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 6px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none;
      display: inline-block; text-align: center; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .link { margin-top: 16px; text-align: center; font-size: 0.85rem; color: var(--muted); }
    .link a { color: var(--accent); text-decoration: none; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Reset Password</h1>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email"/>
        <div class="hint">A reset link will be generated (printed to the server console/logs if email is not configured).</div>
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>

    <div class="link">
      Remember your password? <a href="{{ '/login' }}">Sign in</a>
    </div>
  </div>
</body>
</html>
